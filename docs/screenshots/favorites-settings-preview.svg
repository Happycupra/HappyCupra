<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1920" height="1080" viewBox="0 0 1920 1080">
  <title>DriveDeck Favoritenleisten-Konfiguration</title>
  <desc>Skalierbare Vorschau der Einstellungen für fünf frei angeordnete Schnellaktionen.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071014"/><stop offset="1" stop-color="#10242b"/></linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/></filter>
    <style>.title{font:600 52px sans-serif;fill:#f2f7f7}.heading{font:600 32px sans-serif;fill:#f2f7f7}.body{font:400 25px sans-serif;fill:#f2f7f7}.muted{font:400 21px sans-serif;fill:#93aeb0}.accent{fill:#47d7c8}.button{fill:#21443f;stroke:#47d7c8;stroke-width:2}.card{fill:#172127;stroke:#2b4148;stroke-width:2}</style>
  </defs>
  <rect width="1920" height="1080" rx="36" fill="url(#background)"/>
  <g font-family="sans-serif">
    <text class="title" x="54" y="86">Einstellungen</text>

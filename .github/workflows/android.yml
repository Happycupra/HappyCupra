name: Android CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DRIVEDECK_VERSION_CODE: ${{ github.run_number }}
      DRIVEDECK_VERSION_NAME: 0.3.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Validate XML and SVG previews
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          for path in [*Path('.').rglob('*.xml'), *Path('docs/screenshots').glob('*.svg')]:
              root = ElementTree.parse(path).getroot()
              if path.suffix == '.svg':
                  assert root.tag == '{http://www.w3.org/2000/svg}svg'
                  assert all(root.attrib.get(name) for name in ('width', 'height', 'viewBox'))
          PY
      - name: Unit tests
        run: gradle testDebugUnitTest
      - name: Android lint
        run: gradle lintDebug
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Name versioned debug APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/DriveDeck-${DRIVEDECK_VERSION_NAME}-debug.apk"
          sha256sum "artifacts/DriveDeck-${DRIVEDECK_VERSION_NAME}-debug.apk" > "artifacts/DriveDeck-${DRIVEDECK_VERSION_NAME}-debug.apk.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: DriveDeck-${{ env.DRIVEDECK_VERSION_NAME }}-debug
          path: artifacts/DriveDeck-*-debug.apk*
          if-no-files-found: error
          retention-days: 30

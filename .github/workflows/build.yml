name: CarLauncher C CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'apk/CarLauncher-C.apk'
  workflow_dispatch:

concurrency:
  group: carlauncher-c-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Test, build and publish APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: carlauncher-c-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Store latest APK in main
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/CarLauncher-C.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main
            mkdir -p apk
            cp /tmp/CarLauncher-C.apk apk/CarLauncher-C.apk
            git add apk/CarLauncher-C.apk

            if git diff --cached --quiet; then
              echo "APK unchanged"
              exit 0
            fi

            git commit -m "Update CarLauncher C APK [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "main changed while publishing; retrying ($attempt/3)"
            sleep 2
          done

          echo "Could not publish APK after 3 attempts"
          exit 1

      - name: Remove old migration branch
        run: |
          git push origin --delete minimal-car-launcher || true

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: carlauncher-c-test-report
          path: app/build/reports/tests/
